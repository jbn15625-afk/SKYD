<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة AniMerc</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b0b0b;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 20px;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    header a { color: white; text-decoration: none; }
    .logo { font-size: 24px; font-weight: bold; }
    main { max-width: 1000px; margin: auto; padding: 24px 16px; }
    .panel {
      background: #141414;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 24px;
    }
    h1, h2 { margin-top: 0; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .full { grid-column: 1 / -1; }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #393939;
      background: #090909;
      color: white;
      font: inherit;
    }
    textarea { min-height: 100px; resize: vertical; }
    button {
      border: 1px solid #444;
      border-radius: 8px;
      padding: 11px 16px;
      background: #f5f5f5;
      color: #111;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary { background: #252525; color: white; }
    button.danger { background: #421d1d; color: #fff; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    #status { margin-top: 14px; line-height: 1.8; overflow-wrap: anywhere; }
    .series-item {
      display: grid;
      grid-template-columns: 85px minmax(0, 1fr);
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #292929;
    }
    .series-item:last-child { border-bottom: 0; }
    .poster {
      width: 85px;
      height: 115px;
      object-fit: cover;
      border-radius: 7px;
      background: #252525;
    }
    .series-item h3 { margin: 0 0 8px; }
    .muted { color: #aaa; font-size: 13px; line-height: 1.8; }
    .section-divider { border: 0; border-top: 1px solid #292929; margin: 24px 0; }
    .subheading { margin: 0 0 14px; font-size: 17px; }
    #pageContent[hidden] { display: none; }
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">AniMerc</a>
    <div>
      <a href="series.html">قائمة المسلسلات</a>
      <a href="episodes.html">إدارة الحلقات</a>
      <a href="index.html">الرئيسية</a>
      <a href="index.html">الصفحة الرئيسية</a>
    </div>
  </header>

  <main>
    <div id="pageContent">
      <section class="panel">
        <h1>إضافة واستعراض المسلسلات</h1>
        <p class="muted">يمكن لأي زائر استعراض المسلسلات وإضافة مسلسل. تُطبّق قواعد Realtime Database على كل عملية حفظ.</p>

        <form id="seriesForm">
          <div class="form-grid">
            <label class="field">
              اسم المسلسل *
              <input name="name" required maxlength="150" placeholder="مثال: Weak Hero Class 1">
            </label>

            <label class="field">
              النوع
              <input name="type" maxlength="60" placeholder="مسلسل، فيلم، أنمي">
            </label>

            <label class="field">
              سنة الإصدار
              <input name="year" type="number" min="1900" max="2100" placeholder="2022">
            </label>

            <label class="field">
              التصنيف *
              <select name="genre">
                <option value="action">أكشن</option>
                <option value="school">مدرسي</option>
                <option value="drama">دراما</option>
                <option value="comedy">كوميديا</option>
                <option value="romance">رومانسي</option>
                <option value="thriller">تشويق</option>
                <option value="other">أخرى</option>
              </select>
            </label>

            <label class="field">
              الدول المنتجة (افصل بينها بفاصلة)
              <input name="countries" maxlength="300" placeholder="كوريا الجنوبية، اليابان">
            </label>

            <label class="field">
              لغة الصوت
              <input name="audioLanguage" maxlength="100" placeholder="الكورية">
            </label>

            <label class="field">
              لغة الترجمة
              <input name="subtitleLanguage" maxlength="100" placeholder="العربية">
            </label>

            <label class="field">
              التقييم من 10
              <input name="rating" type="number" min="0" max="10" step="0.1" placeholder="8.5">
            </label>

            <label class="field">
              عدد الإعجابات
              <input name="likes" type="number" min="0" step="1" value="0">
            </label>

            <label class="field">
              الاستوديو المنتج
              <input name="studio" maxlength="150">
            </label>

            <label class="field">
              عدد الحلقات
              <input name="episodeCount" type="number" min="0" step="1" placeholder="16">
            </label>

            <label class="field">
              المنصة
              <input name="platform" maxlength="150" placeholder="Netflix">
            </label>

            <label class="field">
              عدد المواسم
              <input name="seasonCount" type="number" min="0" step="1" placeholder="1">
            </label>

            <label class="field">
              معرّف الموسم السابق
              <input name="previousSeasonId" maxlength="150">
            </label>

            <label class="field">
              معرّف الموسم التالي
              <input name="nextSeasonId" maxlength="150">
            </label>

            <label class="field full">
              رابط صورة الغلاف
              <input name="coverUrl" type="text" inputmode="url" placeholder="example.com/poster.jpg">
            </label>

            <label class="field full">
              رابط خلفية الكمبيوتر
              <input name="desktopBackgroundUrl" type="text" inputmode="url" placeholder="example.com/desktop.jpg">
            </label>

            <label class="field full">
              رابط خلفية الهاتف
              <input name="mobileBackgroundUrl" type="text" inputmode="url" placeholder="example.com/mobile.jpg">
            </label>

            <label class="field full">
              وصف المسلسل
              <textarea name="description" maxlength="3000" placeholder="اكتب وصف المسلسل هنا..."></textarea>
            </label>
          </div>

          <div class="actions">
            <button id="saveBtn" type="submit">إضافة المسلسل</button>
          </div>
          <p id="status" role="status"></p>
        </form>
      </section>

    </div>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
