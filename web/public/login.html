<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>تسجيل الدخول | Animerc</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="logo auth-logo" href="index.html">Ani<span>merc</span></a>
    <span class="eyebrow">مرحبًا بك في عالم Animerc</span>
    <h1 id="formTitle">تسجيل الدخول</h1>
    <p class="auth-description" id="formDescription">سجّل دخولك للعودة إلى عالمك المفضل.</p>

    <form id="authForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" placeholder="name@example.com" autocomplete="email" required>

      <label for="password">كلمة المرور</label>
      <input id="password" type="password" placeholder="أدخل كلمة المرور" minlength="6" autocomplete="current-password" required>

      <button class="primary-button auth-submit" id="submitButton" type="submit">تسجيل الدخول</button>
    </form>

    <p class="auth-message" id="authMessage" role="status"></p>

    <p class="auth-switch">
      <span id="switchText">ليس لديك حساب؟</span>
      <button type="button" id="switchMode">إنشاء حساب</button>
    </p>

    <a class="back-home" href="index.html">← الرئيسية</a>
    <a class="back-home" href="index.html">← العودة إلى الصفحة الرئيسية</a>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
